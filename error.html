<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self';" />
<title>DSH Client — 启动失败</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #0d1117; color: #c9d1d9;
    font-family: "Segoe UI", -apple-system, "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 560px; background: #161b22; border: 1px solid #30363d;
    border-radius: 12px; padding: 26px 28px; box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 6px; font-size: 17px; color: #ff7b72; display: flex; align-items: center; gap: 10px; }
  .sub { color: #8b949e; font-size: 13px; margin-bottom: 18px; }
  .reason {
    background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
    padding: 12px 14px; font-size: 13px; color: #f0f6fc; white-space: pre-wrap;
    word-break: break-word; max-height: 180px; overflow: auto; margin-bottom: 14px;
  }
  .stderr {
    background: #0d1117; border: 1px solid #21262d; border-radius: 8px;
    padding: 10px 12px; font-size: 11.5px; color: #8b949e; font-family: Consolas, "Courier New", monospace;
    white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; margin-bottom: 18px;
  }
  .stderr.empty { display: none; }
  .actions { display: flex; gap: 12px; justify-content: flex-end; }
  button {
    font: inherit; font-size: 13px; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid #30363d; background: #21262d; color: #f0f6fc; transition: background .15s;
  }
  button:hover { background: #30363d; }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.primary:hover { background: #388bfd; }
</style>
</head>
<body>
  <div class="card">
    <h1>⚠ 服务启动失败</h1>
    <div class="sub">DeepSeek Harness Web 服务未能就绪。可以重试，或退出客户端。</div>
    <div class="reason" id="reason">正在获取失败原因…</div>
    <div class="stderr empty" id="stderr"></div>
    <div class="actions">
      <button id="quit">退出</button>
      <button id="retry" class="primary">重试启动</button>
    </div>
  </div>
  <script src="error-render.js"></script>
</body>
</html>
